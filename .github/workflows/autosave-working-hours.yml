name: Patch working-hours autosave

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Settings.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/Settings.jsx')
          s = p.read_text()
          old = '''  function updateSelectedDay(fields) {
    setSchedule((prev) => ({ ...prev, dates: { ...prev.dates, [selectedKey]: { ...(prev.dates[selectedKey] || emptyDay()), ...fields } } }));
    setHoursDirty(true);
  }
  function resetSelectedDay() {
    setSchedule((prev) => { const dates = { ...prev.dates }; delete dates[selectedKey]; return { ...prev, dates }; });
    setHoursDirty(true);
  }
  async function handleSaveHours() {
    setSavingHours(true);
    try { await updateProfile(user.id, { working_hours: schedule }); setHoursDirty(false); }
    catch { window.alert("Не удалось сохранить рабочее время. Проверь подключение."); }
    finally { setSavingHours(false); }
  }
'''
          new = '''  async function persistSchedule(nextSchedule) {
    if (!user) return;
    setSavingHours(true);
    try {
      await updateProfile(user.id, { working_hours: nextSchedule });
      setHoursDirty(false);
    } catch {
      setHoursDirty(true);
      window.alert("Не удалось сохранить рабочее время. Проверь подключение.");
    } finally {
      setSavingHours(false);
    }
  }
  function updateSelectedDay(fields) {
    setSchedule((prev) => {
      const nextSchedule = { ...prev, dates: { ...prev.dates, [selectedKey]: { ...(prev.dates[selectedKey] || emptyDay()), ...fields } } };
      void persistSchedule(nextSchedule);
      return nextSchedule;
    });
    setHoursDirty(true);
  }
  function resetSelectedDay() {
    setSchedule((prev) => {
      const dates = { ...prev.dates };
      delete dates[selectedKey];
      const nextSchedule = { ...prev, dates };
      void persistSchedule(nextSchedule);
      return nextSchedule;
    });
    setHoursDirty(true);
  }
  async function handleSaveHours() {
    await persistSchedule(schedule);
  }
'''
          if old not in s:
              raise SystemExit('target block not found')
          s = s.replace(old, new, 1)
          old2 = '''    setSchedule((prev) => {
      const dates = { ...prev.dates };
      targets.forEach((key) => { dates[key] = cloneDay(selectedDay); });
      return { ...prev, dates };
    });
    setHoursDirty(true);
    setCopyOpen(false);
'''
          new2 = '''    setSchedule((prev) => {
      const dates = { ...prev.dates };
      targets.forEach((key) => { dates[key] = cloneDay(selectedDay); });
      const nextSchedule = { ...prev, dates };
      void persistSchedule(nextSchedule);
      return nextSchedule;
    });
    setHoursDirty(true);
    setCopyOpen(false);
'''
          if old2 not in s:
              raise SystemExit('copy block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/screens/Settings.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix working-hours autosave'
          git push
