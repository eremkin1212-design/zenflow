name: Fix calendar syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix malformed dragEnd expression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/Calendar.jsx')
          s = p.read_text()
          old = 'Math.round((gridStart + (d.currentTop / HOUR_H) * 60) / 15) * 15));'
          new = 'Math.round((gridStart + (d.currentTop / HOUR_H) * 60) / 15) * 15)));'
          if old not in s:
              raise SystemExit('Expected malformed expression was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-calendar-syntax.yml
          git add src/screens/Calendar.jsx
          git commit -m 'Fix calendar build syntax error'
          git push
