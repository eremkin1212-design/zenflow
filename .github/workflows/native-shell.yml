name: Native shell

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - '.github/workflows/native-shell.yml'

jobs:
  native-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create iOS shell
        run: npx cap add ios

      - name: Create Android shell
        run: npx cap add android

      - name: Prepare RITENA brand assets
        run: |
          mkdir -p assets
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { copyFile } from 'node:fs/promises';

          await sharp('public/icon-512.png')
            .resize(1024, 1024, { fit: 'fill' })
            .png()
            .toFile('assets/icon-only.png');

          const splashLogo = await sharp('public/icon-512.png')
            .resize(900, 900, { fit: 'contain' })
            .png()
            .toBuffer();

          await sharp({
            create: {
              width: 2732,
              height: 2732,
              channels: 4,
              background: '#1A3026'
            }
          })
            .composite([{ input: splashLogo, gravity: 'center' }])
            .png()
            .toFile('assets/splash.png');

          await copyFile('assets/splash.png', 'assets/splash-dark.png');
          NODE

      - name: Generate iOS icon and splash
        run: npx capacitor-assets generate --ios

      - name: Generate Android icon and splash
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: ritena-ios
          path: ios/
          retention-days: 14

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: ritena-android
          path: android/
          retention-days: 14
