name: Patch working day calendar

on:
  push:
    branches: [feature/working-day-calendar-indicators]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch working day UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('src/screens/Settings.jsx')
          s = settings.read_text()
          old = 'const hasSchedule = Boolean(schedule.dates[selectedKey]);'
          new = 'const hasSchedule = Boolean(schedule.dates[selectedKey]?.on);'
          if old not in s:
              raise SystemExit('Settings hasSchedule pattern not found')
          s = s.replace(old, new, 1)
          old = 'schedule.dates[fmtDate(d)] && <span className="absolute bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full"'
          new = 'schedule.dates[fmtDate(d)]?.on && <span className="absolute bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full"'
          if old not in s:
              raise SystemExit('Settings calendar dot pattern not found')
          s = s.replace(old, new, 1)
          settings.write_text(s)

          cal = Path('src/screens/Calendar.jsx')
          c = cal.read_text()
          old = 'import { getProfile } from "../data/profile";'
          new = 'import { getProfile, updateProfile } from "../data/profile";'
          if old not in c:
              raise SystemExit('Calendar profile import pattern not found')
          c = c.replace(old, new, 1)

          old = '  const [drag, setDrag] = useState(null);\n  const swipe = useRef(null);'
          new = '  const [drag, setDrag] = useState(null);\n  const [workTimeOpen, setWorkTimeOpen] = useState(false);\n  const [workStart, setWorkStart] = useState("10:00");\n  const [workEnd, setWorkEnd] = useState("22:00");\n  const [savingWorkTime, setSavingWorkTime] = useState(false);\n  const swipe = useRef(null);'
          if old not in c:
              raise SystemExit('Calendar state pattern not found')
          c = c.replace(old, new, 1)

          old = '  function openAtTime(e) {'
          new = '''  function openWorkTime() {\n    setWorkStart(dayHours.start || "10:00");\n    setWorkEnd(dayHours.end || "22:00");\n    setWorkTimeOpen(true);\n  }\n  async function saveWorkTime() {\n    if (!user) return;\n    setSavingWorkTime(true);\n    try {\n      const current = normalizeSchedule(hours);\n      const key = fmtDate(selectedDate);\n      const base = current.weekly.find((d) => d.key === KEYS[mondayIndex(selectedDate)]) || DEFAULT_WEEK[mondayIndex(selectedDate)];\n      const next = { ...current, dates: { ...current.dates, [key]: { ...base, on: true, start: workStart, end: workEnd } } };\n      await updateProfile(user.id, { working_hours: next });\n      setHours(next);\n      setWorkTimeOpen(false);\n    } catch {\n      window.alert("Не удалось сохранить рабочее время");\n    } finally {\n      setSavingWorkTime(false);\n    }\n  }\n\n  function openAtTime(e) {'''
          if old not in c:
              raise SystemExit('Calendar openAtTime pattern not found')
          c = c.replace(old, new, 1)

          old = '<div className="flex justify-between mx-5 mt-1">{weekDates.map((d, i) => <button key={d.toISOString()} onClick={() => goDate(d)} className="flex flex-col items-center gap-1 rounded-xl py-2 w-9" style={{ background: d.toDateString() === selectedDate.toDateString() ? "var(--moss)" : "transparent", color: d.toDateString() === selectedDate.toDateString() ? "var(--on-accent)" : "var(--ink-soft)" }}><span className="text-[10px] uppercase">{WEEKDAYS[i]}</span><span className="text-sm font-medium">{d.getDate()}</span></button>)}</div>'
          new = '<div className="flex justify-between mx-5 mt-1">{weekDates.map((d, i) => { const wh = hoursForDate(hours, d); const active = d.toDateString() === selectedDate.toDateString(); return <button key={d.toISOString()} onClick={() => goDate(d)} className="flex flex-col items-center gap-1 rounded-xl py-2 w-9" style={{ background: active ? "var(--moss)" : "transparent", color: active ? "var(--on-accent)" : "var(--ink-soft)" }}><span className="text-[10px] uppercase">{WEEKDAYS[i]}</span><span className="text-sm font-medium">{d.getDate()}</span>{wh.on && <span className="w-1 h-1 rounded-full" style={{ background: active ? "var(--on-accent)" : "var(--moss)" }} />}</button>; })}</div>'
          if old not in c:
              raise SystemExit('Calendar week strip pattern not found')
          c = c.replace(old, new, 1)

          old = '{!loading && view === "day" && <div className="mx-5 mt-2 text-center text-xs" style={{ color: dayHours.on ? "var(--ink-soft)" : "var(--clay)" }}>{dayHours.on ? `Работа: ${dayHours.start}–${dayHours.end}${dayHours.breakStart ? ` · перерыв ${dayHours.breakStart}–${dayHours.breakEnd}` : ""}` : "Выходной"}</div>}'
          new = '''{!loading && view === "day" && <div className="mx-5 mt-2 text-center text-xs" style={{ color: dayHours.on ? "var(--ink-soft)" : "var(--clay)" }}>{dayHours.on ? `Работа: ${dayHours.start}–${dayHours.end}${dayHours.breakStart ? ` · перерыв ${dayHours.breakStart}–${dayHours.breakEnd}` : ""}` : <button onClick={openWorkTime} className="underline underline-offset-2" style={{ color: "var(--moss)" }}>Выходной · задать рабочее время</button>}</div>}'''
          if old not in c:
              raise SystemExit('Calendar work status pattern not found')
          c = c.replace(old, new, 1)

          marker = '    {loading ? <div className="py-10 text-center text-sm text-[var(--ink-soft)]">Загружаем записи…</div>'
          modal = '''    {workTimeOpen && <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/20"><div className="w-full max-w-sm rounded-t-3xl p-5 bg-[var(--surface)] border border-[var(--line)]"><div className="text-lg font-serif mb-4">Рабочее время</div><div className="flex gap-3"><label className="flex-1 text-xs text-[var(--ink-soft)]">Начало<input type="time" value={workStart} onChange={(e) => setWorkStart(e.target.value)} className="mt-1 w-full rounded-xl p-3 bg-[var(--surface-alt)] border border-[var(--line)] outline-none font-mono" /></label><label className="flex-1 text-xs text-[var(--ink-soft)]">Конец<input type="time" value={workEnd} onChange={(e) => setWorkEnd(e.target.value)} className="mt-1 w-full rounded-xl p-3 bg-[var(--surface-alt)] border border-[var(--line)] outline-none font-mono" /></label></div><div className="flex gap-2 mt-4"><button onClick={() => setWorkTimeOpen(false)} className="flex-1 rounded-full py-3 bg-[var(--surface-alt)]">Отмена</button><button onClick={saveWorkTime} disabled={savingWorkTime} className="flex-1 rounded-full py-3 font-medium" style={{ background: "var(--moss)", color: "var(--on-accent)" }}>{savingWorkTime ? "Сохраняем…" : "Сохранить"}</button></div></div></div>}\n'''
          if marker not in c:
              raise SystemExit('Calendar render marker not found')
          c = c.replace(marker, modal + marker, 1)
          cal.write_text(c)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/Settings.jsx src/screens/Calendar.jsx
          git diff --cached --quiet && exit 0
          git commit -m "[auto] Working day indicators and calendar hours"
          git push